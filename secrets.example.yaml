# Copy this file to secrets.yaml and replace every placeholder.
# secrets.yaml is ignored by Git.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Generate with:
# python -c "import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())"
# This dummy value decodes to 32 zero bytes so the example remains valid in CI.
api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota_password: "CHANGE_ME_TO_A_LONG_RANDOM_OTA_PASSWORD"
fallback_ap_password: "CHANGE_ME_AP_PASSWORD"

# Camera access only. Create a long-lived token in the Home Assistant user
# profile and keep the literal "Bearer " prefix. The placeholder is safe when
# the camera feature isn't used.
ha_bearer: "Bearer YOUR_HOME_ASSISTANT_LONG_LIVED_ACCESS_TOKEN"
