# =============================================================================
# reTerminal Sticky - ESPHome example
# Copy this file to reterminal-sticky.yaml before adding local values.
# Start with README.md; detailed field notes are in docs/CONFIGURATION.md.
#
# MCU: ESP32-S3R8 (8 MB octal PSRAM, 32 MB flash)
# Critical: GPIO45 (PWR_HOLD) + GPIO46 (PWR_LOCK) must be HIGH at boot,
# otherwise the device powers off. The pwr_hold/pwr_lock outputs below manage
# those signals through boot and deep sleep.
#
# Serial debug: UART0 via CH343P USB-to-UART bridge.
# =============================================================================

substitutions:
  device_name: reterminal-sticky
  friendly_name: "reTerminal Sticky"

  home_label: "Home"
  camera_label: "Front Door"
  camera_title: "FRONT DOOR"
  assistant_label: "Assist"
  missed_ring_title: "MISSED RING"
  missed_ring_snapshot_path: "/local/reterminal_sticky_last_ring.jpg"
  # The camera takes one of the six menu positions when this is true.
  camera_menu_enabled: "true"
  # Assist uses another menu position. With both special tiles enabled, four
  # room positions remain; disable either feature to reclaim its slot.
  voice_assistant_enabled: "true"

  # Whole-room on/off switch along the bottom of each room tile.
  menu_quick_toggle: "true"
  # Volume of the tick that confirms a tap; "0%" mutes it.
  touch_tick_level: "30%"
  # Idle seconds before the clock face, and before deep sleep on battery.
  idle_clock_seconds: "30"
  idle_sleep_seconds: "180"
  # Reconnect to the last access point without scanning. Use "false" to pick
  # the strongest of several access points on every wake.
  wifi_fast_connect: "true"

  # Replace these example Home Assistant entity IDs with your own. Indoor
  # temperature comes from the Sticky's onboard SHT40 instead.
  outdoor_temp_entity: sensor.example_outdoor_temperature
  camera_entity: camera.example_front_door
  doorbell_automation_entity: automation.example_doorbell_snapshot

  # Home Assistant origin only (scheme + host + optional port; no path).
  ha_base_url: "http://homeassistant.local:8123"

# Rooms are ordinary ESPHome packages. Slots are zero-based and contiguous;
# keys must be unique lowercase ESPHome ID fragments. The example includes one
# of every package shape so CI compiles all supported card counts.
packages:
  room_one: !include
    file: packages/room-1-card.yaml
    vars:
      slot: "0"
      key: room_one
      label: "Room One"
      icon: "F04B9"
      card_1_label: "Main Lights"
      card_1_entity: light.example_room_one_main
      card_1_icon_on: "F04B9"
      card_1_icon_off: "F156D"

  room_two: !include
    file: packages/room-2-cards.yaml
    vars:
      slot: "1"
      key: room_two
      label: "Room Two"
      icon: "F02E3"
      card_1_label: "Main Lights"
      card_1_entity: light.example_room_two_main
      card_1_icon_on: "F0769"
      card_1_icon_off: "F17C7"
      card_2_label: "Floor Lamp"
      card_2_entity: light.example_room_two_floor
      card_2_icon_on: "F08DD"
      card_2_icon_off: "F17C8"

  room_three: !include
    file: packages/room-3-cards.yaml
    vars:
      slot: "2"
      key: room_three
      label: "Room Three"
      icon: "F0379"
      card_1_label: "Window Lights"
      card_1_entity: light.example_room_three_window
      card_1_icon_on: "F12BA"
      card_1_icon_off: "F12BB"
      card_2_label: "Closet Light"
      card_2_entity: light.example_room_three_closet
      card_2_icon_on: "F0F90"
      card_2_icon_off: "F0F91"
      card_3_label: "Accent Lights"
      card_3_entity: light.example_room_three_accent
      card_3_icon_on: "F1051"
      card_3_icon_off: "F1A4B"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  project:
    name: "community.reterminal-sticky"
    version: "0.1.0"
  # Shared C++ drawing helpers for all display pages.
  includes:
    - sticky_logic.h
    - room_model.h
    - panel_ui.h
  on_boot:
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        # BQ25616 CE is active-low. GPIO outputs initialize OFF, which would
        # drive this inverted pin HIGH and disable charging unless we
        # explicitly turn the logical output on.
        - output.turn_on: charge_enable
        # Pads are still held from the previous deep sleep; re-driving the
        # same levels first makes release seamless (rails HIGH, charger LOW).
        - lambda: 'panel_ui::release_power_rail_hold();'
        - switch.turn_on: touch_power_enable
        - pcf8563.read_time:
        # Classify this boot. A battery timer wake is either a quiet clock
        # tick (1) or an HA sync tick (2): syncs land on top-of-hour wakes
        # during the day and every other hour overnight. Anything else -
        # button ext1 wake, OTA reboot, cold boot - is a full interactive
        # window (0).
        - lambda: |-
            id(battery_current).update();
            id(battery_level).update();
            // A timer wake stays quiet only when external power is absent.
            // USB can be connected while the MCU is already asleep, so a
            // timer wake with GPIO9 HIGH must become an interactive window.
            // The BQ27220 averages current over ~1 s windows, so right after
            // a wake it still reports sleep-era ~0 mA; never use that stale
            // current sample to decide whether USB is connected.
            const bool external_power = gpio_get_level(GPIO_NUM_9) != 0;
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER &&
                !external_power) {
              id(wake_count) += 1;
              auto now = id(rtc_time).now();
              bool sync;
              bool day = true;
              if (now.is_valid()) {
                day = now.hour >= 7 && now.hour < 23;
                // Wakes land a few seconds past the boundary; minute 57-3
                // brackets the top of the hour on either side.
                sync = day ? (now.minute >= 57 || now.minute <= 3)
                           : (now.hour % 2) == 1;
              } else {
                sync = (id(wake_count) % 4) == 0;
              }
              id(boot_mode) = sync ? 2 : 1;
              id(epaper_display).show_page(id(page_sleep));
              // Timer wakes normally use the quiet waveform, including HA
              // sync wakes. Every twelfth tick requests a full ghost-clean;
              // wake_count survives deep sleep, unlike the driver's counter.
              id(refresh_request) = (id(wake_count) % 12) == 0 ? 2 : 1;
            } else {
              // Button, OTA, cold boot: interactive window on the menu.
              id(boot_mode) = 0;
              id(epaper_display).show_page(id(page_menu));
            }
            // Serial-visible forensics for dark wakes: which reset/wake path
            // produced this boot and how it was classified.
            ESP_LOGI("boot", "wake cause=%d usb=%d gauge_mA=%.0f mode=%d count=%d",
                     (int) esp_sleep_get_wakeup_cause(), external_power,
                     id(battery_current).state, id(boot_mode), id(wake_count));
        # Clock ticks never touch the radio; the render runs off the PCF8563.
        - if:
            condition:
              lambda: 'return id(boot_mode) == 1;'
            then:
              - wifi.disable:
        # Beep for the wake button now; the first refresh takes a while.
        - if:
            condition:
              lambda: |-
                return id(boot_mode) == 0 &&
                       esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1;
            then:
              - lambda: 'id(wake_beeped) = true;'
              - light.turn_on:
                  id: buzzer
                  brightness: 50%
              - delay: 120ms
              - light.turn_off: buzzer
    # The power rails above are already safe before room registration begins.
    # Packages bind their HA components at priority 500 between reset/finalize.
    - priority: 550
      then:
        - lambda: 'panel_ui::room_model().reset();'
    - priority: 400
      then:
        - lambda: |-
            panel_ui::room_model().finalize(${camera_menu_enabled},
                                            ${voice_assistant_enabled});
            // Wakes from sleep restore the saved light states; cold boots and
            // OTA restarts wait for Home Assistant.
            if (esp_sleep_get_wakeup_cause() != ESP_SLEEP_WAKEUP_UNDEFINED)
              panel_ui::room_model().load_cache(id(light_cache));
    - priority: -100
      then:
        - delay: 2s
        # Skip if the snapshot paint has already started.
        - lambda: |-
            if (id(last_draw) != 0 || id(draw_busy)) return;
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 0, 0, 800, 480);
            id(display_dirty) = true;

# ESP32-S3R8: 8 MB octal PSRAM. Required for the runtime camera snapshot
# buffer (640x480 grayscale = 307 KB), which exceeds free internal heap.
esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: arduino
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

# Serial logging goes to the physical UART0 (CH343P bridge), not USB_CDC.
logger:
  hardware_uart: UART0
  # ESPHome's DEBUG voice logs include verbatim transcripts and responses.
  # The screen displays them, but serial logs deliberately stay quiet.
  logs:
    voice_assistant: WARN

# Coalesce redraws through one scheduler. The ePaper driver is asynchronous:
# update() starts a state machine and returns immediately, so requests must
# remain queued until the driver reports IDLE.
globals:
  - id: last_draw
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: display_dirty
    type: bool
    restore_value: no
    initial_value: 'false'
  # Union of the screen areas invalidated while refresh requests coalesce.
  # A full/page-change refresh expands this to the whole 800x480 panel.
  - id: dirty_left
    type: int
    restore_value: no
    initial_value: '800'
  - id: dirty_top
    type: int
    restore_value: no
    initial_value: '480'
  - id: dirty_right
    type: int
    restore_value: no
    initial_value: '0'
  - id: dirty_bottom
    type: int
    restore_value: no
    initial_value: '0'
  # Pending waveform: 0 = ordinary/same-page, 1 = explicit partial,
  # 2 = explicit full. FULL is sticky and always wins while requests coalesce.
  - id: refresh_request
    type: int
    restore_value: no
    initial_value: '2'
  # Interactive/USB ghosting budget. Deep-sleep timer wakes use wake_count for
  # their cross-reboot full-clean cadence.
  - id: partial_refreshes
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_activity
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: camera_shown_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # True once page_camera has painted at least once for the current snapshot;
  # the dismiss hitbox stays disarmed until then. Prevents an impatient tap
  # from dismissing the camera page before the slow ePaper ever shows it.
  - id: camera_drawn
    type: bool
    restore_value: no
    initial_value: 'false'
  # True from update() start until EPaperBase's async state returns to IDLE.
  - id: draw_busy
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: draw_started_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Per-room menu polarity and card masks live in room_model.h alongside the
  # configured room/card counts they describe.
  # 0 = interactive window, 1 = deep-sleep clock tick, 2 = deep-sleep HA sync.
  - id: boot_mode
    type: int
    restore_value: no
    initial_value: '0'
  # Timer-wake counter; also provides the cross-sleep ghost-clean cadence.
  - id: wake_count
    type: int
    restore_value: yes
    initial_value: '0'
  # fnv1 hash of the doorbell automation's last_triggered already shown.
  - id: last_ring_hash
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # Last known HA values so offline clock ticks render real temps. Written
  # once per sleep entry to keep NVS wear negligible.
  - id: cached_out_f
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: cached_in_f
    type: float
    restore_value: yes
    initial_value: 'NAN'
  - id: cached_sun_up
    type: bool
    restore_value: yes
    initial_value: 'true'
  # Light states from RoomModel::pack_cache(), saved at sleep entry.
  - id: light_cache
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # on_boot already beeped for the wake button.
  - id: wake_beeped
    type: bool
    restore_value: no
    initial_value: 'false'
  # Footer link state: start of the current wait, when the link came up (0
  # while down), and the footer_signature() last painted.
  - id: link_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: api_connected_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: footer_drawn
    type: int
    restore_value: no
    initial_value: '-1'
  # The current frame's clip region covers the footer.
  - id: footer_in_frame
    type: bool
    restore_value: no
    initial_value: 'false'
  # A light action was sent and Home Assistant never reported the result.
  - id: action_unanswered
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: unanswered_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Camera tile status line (panel_ui::CameraTileState).
  - id: camera_tile_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: camera_tile_changed_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Header temperatures as last painted.
  - id: shown_out_f
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: shown_in_f
    type: float
    restore_value: no
    initial_value: 'NAN'
  # Camera page caption for live views and missed-ring recaps.
  - id: camera_title
    type: std::string
    restore_value: no
    initial_value: '"${camera_title}"'
  # Assist speech and responses are ephemeral by design: they live only in
  # RAM and are cleared on every boot; no polling timestamps are persisted.
  # phase: 0 ready, 1 listening, 2 transcribing, 3 done, 4 error,
  # 5 waiting for Home Assistant to connect.
  - id: assist_phase
    type: int
    restore_value: no
    initial_value: '0'
  - id: assist_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: assist_heard
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: assist_response
    type: std::string
    restore_value: no
    initial_value: '""'
  # Diagnostics contain counts only; recorded audio is never retained/logged.
  - id: assist_mic_chunks
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: assist_mic_activity
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: assist_start_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: assist_wait_since
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Scope entity-driven refreshes to pages that actually render the changed
# value. Page changes always redraw from the latest states, so off-page changes
# don't need to spend an e-paper cycle.
script:
  # Periodic battery/header refresh. The sleep face has only a small battery
  # gauge in this scope; interactive pages use the full 64px header.
  - id: invalidate_header_if_visible
    mode: restart
    then:
      - lambda: |-
          auto *page = id(epaper_display).get_active_page();
          if (page == id(page_sleep)) {
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 736, 8, 800, 48);
            id(display_dirty) = true;
          } else if (page != id(page_camera)) {
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 0, 0, 800, 70);
            id(display_dirty) = true;
          }

  # HA temperatures occupy the left half of the sleep face and the compact
  # top bar everywhere else.
  - id: invalidate_temperature_if_visible
    mode: restart
    then:
      - lambda: |-
          auto *page = id(epaper_display).get_active_page();
          if (page == id(page_sleep)) {
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 32, 112, 400, 408);
            id(display_dirty) = true;
          } else if (page != id(page_camera)) {
            // Skip readings that print the same whole degree.
            const float out_f = id(outdoor_temp).has_state() ? id(outdoor_temp).state : id(cached_out_f);
            const float in_f = id(indoor_temp).has_state() ? id(indoor_temp).state : id(cached_in_f);
            if (id(last_draw) != 0 &&
                panel_ui::same_whole_degrees(out_f, id(shown_out_f)) &&
                panel_ui::same_whole_degrees(in_f, id(shown_in_f)))
              return;
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 0, 0, 800, 70);
            id(display_dirty) = true;
          }

  - id: invalidate_sleep_if_visible
    mode: restart
    then:
      - lambda: |-
          if (id(epaper_display).get_active_page() == id(page_sleep)) {
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 32, 112, 400, 260);
            id(display_dirty) = true;
          }

  # One invalidator covers every configured room/card. A large ON/OFF polarity
  # change promotes the next update to a full waveform; brightness/count-only
  # changes stay regional and may use a partial waveform. Reports that change
  # nothing visible are skipped.
  - id: invalidate_room_card_if_visible
    parameters:
      room_index: int
      card_index: int
    mode: parallel
    max_runs: 24
    then:
      - lambda: |-
          auto &rooms = panel_ui::room_model();
          if (rooms.card(room_index, card_index) == nullptr) return;
          auto *page = id(epaper_display).get_active_page();
          if (page == id(page_menu)) {
            if (id(last_draw) != 0 && rooms.menu_tile_current(room_index)) return;
            const int mode = rooms.menu_mode(room_index);
            if (id(last_draw) != 0 && mode != rooms.rendered_menu_mode(room_index))
              id(refresh_request) = 2;
            const int x = panel_ui::RoomModel::menu_x(room_index);
            const int y = panel_ui::RoomModel::menu_y(room_index);
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top),
                                           id(dirty_right), id(dirty_bottom),
                                           x - 8, y - 8, x + 248, y + 168);
            id(display_dirty) = true;
          } else if (page == id(page_room) && rooms.active_room() == room_index) {
            if (id(last_draw) != 0 && rooms.card_current(room_index, card_index)) return;
            const int cards = rooms.card_mask(room_index);
            if (id(last_draw) != 0 && rooms.rendered_card_mask(room_index) >= 0 &&
                cards != rooms.rendered_card_mask(room_index))
              id(refresh_request) = 2;
            const int x = rooms.card_x(room_index, card_index);
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top),
                                           id(dirty_right), id(dirty_bottom),
                                           x - 8, 70, x + 248, 438);
            id(display_dirty) = true;
          }

  # Tick for an accepted tap. Silent while the microphone is in use.
  - id: touch_tick
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(sticky_voice).is_running() &&
                     !id(start_sticky_assistant).is_running();
          then:
            - light.turn_on:
                id: buzzer
                brightness: ${touch_tick_level}
            - delay: 30ms
            - light.turn_off: buzzer

  # Two ticks: an action failed or was never confirmed.
  - id: touch_reject
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(sticky_voice).is_running() &&
                     !id(start_sticky_assistant).is_running();
          then:
            - light.turn_on:
                id: buzzer
                brightness: ${touch_tick_level}
            - delay: 40ms
            - light.turn_off: buzzer
            - delay: 90ms
            - light.turn_on:
                id: buzzer
                brightness: ${touch_tick_level}
            - delay: 40ms
            - light.turn_off: buzzer

  # Button beep, skipped for the wake press that on_boot already beeped.
  - id: button_beep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !(id(wake_beeped) && millis() < 3000);'
          then:
            - light.turn_on:
                id: buzzer
                brightness: 50%
            - delay: 200ms
            - light.turn_off: buzzer

  # Send an action the room model has already locked, waiting up to 10 s for
  # the Home Assistant link (e.g. just after a wake).
  # card_index -1 = whole room; level 0 = on/off, otherwise brightness %.
  - id: send_light_action
    parameters:
      room_index: int
      card_index: int
      level: int
    mode: parallel
    max_runs: 12
    then:
      - script.execute: touch_tick
      - logger.log:
          format: "Action: room=%d card=%d level=%d"
          args: [room_index, card_index, level]
      - if:
          condition:
            lambda: 'return !panel_ui::ha_ready();'
          then:
            - wait_until:
                condition:
                  lambda: 'return panel_ui::ha_ready();'
                timeout: 10s
            # Let the action subscription follow the state subscription.
            - delay: 400ms
      - if:
          condition:
            lambda: 'return panel_ui::ha_ready();'
          then:
            - lambda: |-
                auto &rooms = panel_ui::room_model();
                if (card_index < 0) {
                  rooms.mark_room_sent(room_index, millis());
                } else {
                  rooms.mark_card_sent(room_index, card_index, millis());
                }
            - if:
                condition:
                  lambda: 'return level > 0;'
                then:
                  - homeassistant.service:
                      service: light.turn_on
                      data:
                        entity_id: !lambda |-
                          return panel_ui::room_model().service_targets(room_index, card_index);
                        brightness_pct: !lambda 'return to_string(level);'
                else:
                  - homeassistant.service:
                      service: !lambda |-
                        auto &rooms = panel_ui::room_model();
                        return card_index < 0 ? rooms.room_service(room_index)
                                              : rooms.card_service(room_index, card_index);
                      data:
                        entity_id: !lambda |-
                          auto &rooms = panel_ui::room_model();
                          return card_index < 0 ? rooms.room_targets(room_index)
                                                : rooms.service_targets(room_index, card_index);
          else:
            - logger.log:
                level: WARN
                format: "Action dropped: Home Assistant not reachable"
            - lambda: |-
                auto &rooms = panel_ui::room_model();
                if (card_index < 0) {
                  rooms.cancel_room(room_index);
                } else {
                  rooms.cancel_card(room_index, card_index);
                }
                // Show the footer as offline now, not after the grace period.
                id(link_since) = millis() - 20000UL;
            - script.execute: touch_reject

  # Card switch. Paired lights keep their semantics: if either member is on,
  # both are turned off; otherwise both are turned on.
  - id: toggle_room_card
    parameters:
      room_index: int
      card_index: int
    mode: parallel
    max_runs: 12
    then:
      - if:
          condition:
            lambda: |-
              return panel_ui::room_model().begin_card_toggle(room_index, card_index, millis());
          then:
            - script.execute:
                id: send_light_action
                room_index: !lambda 'return room_index;'
                card_index: !lambda 'return card_index;'
                level: 0

  # Direct brightness level (25, 50, or 100 percent); also turns the light on.
  - id: set_room_card_brightness
    parameters:
      room_index: int
      card_index: int
      level: int
    mode: parallel
    max_runs: 12
    then:
      - if:
          condition:
            lambda: |-
              return panel_ui::room_model().begin_card_level(room_index, card_index, level,
                                                             millis());
          then:
            - script.execute:
                id: send_light_action
                room_index: !lambda 'return room_index;'
                card_index: !lambda 'return card_index;'
                level: !lambda 'return level;'

  # Whole-room switch on the menu: any light on turns the room off, otherwise
  # every light in it turns on.
  - id: toggle_room
    parameters:
      room_index: int
    mode: parallel
    max_runs: 6
    then:
      - if:
          condition:
            lambda: |-
              return panel_ui::room_model().begin_room_toggle(room_index, millis());
          then:
            - script.execute:
                id: send_light_action
                room_index: !lambda 'return room_index;'
                card_index: -1
                level: 0

  # Redraw only the camera tile's status line.
  - id: invalidate_camera_tile_if_visible
    mode: restart
    then:
      - lambda: |-
          auto &rooms = panel_ui::room_model();
          if (id(epaper_display).get_active_page() != id(page_menu) ||
              !rooms.valid() || !rooms.camera_enabled())
            return;
          const int x = panel_ui::RoomModel::menu_x(rooms.camera_slot());
          const int y = panel_ui::RoomModel::menu_y(rooms.camera_slot());
          panel_ui::include_dirty_region(id(dirty_left), id(dirty_top),
                                         id(dirty_right), id(dirty_bottom),
                                         x + 8, y + 96, x + 232, y + 148);
          id(display_dirty) = true;

  # Dense Assist text is unreliable with this display's fast partial waveform.
  # Transcript, response, completion state, and control label settle together,
  # so render that final frame with one clean waveform.
  - id: refresh_assistant_full_if_visible
    mode: restart
    then:
      - lambda: |-
          if (id(epaper_display).get_active_page() != id(page_assistant)) return;
          panel_ui::include_dirty_region(id(dirty_left), id(dirty_top),
                                         id(dirty_right), id(dirty_bottom),
                                         0, 70, 800, 426);
          id(refresh_request) = 2;
          id(display_dirty) = true;

  # Prepare the Listening frame before capture. The scheduler launches the mic
  # only after that e-paper frame is physically complete.
  - id: queue_sticky_assistant
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(assist_connected) && !id(assist_start_requested) &&
                     !id(start_sticky_assistant).is_running() &&
                     !id(sticky_voice).is_running();
          then:
            - lambda: |-
                id(assist_heard).clear();
                id(assist_response).clear();
                id(assist_mic_chunks) = 0;
                id(assist_mic_activity) = 0;
                id(assist_phase) = 1;
                id(assist_start_requested) = true;
                id(last_activity) = millis();
            - script.execute: refresh_assistant_full_if_visible
          else:
            # Not connected: wait for the link (phase 5; the scheduler starts
            # it or gives up after 10 s) unless it is already known offline.
            - if:
                condition:
                  lambda: 'return !id(assist_connected) && id(assist_phase) != 5;'
                then:
                  - lambda: |-
                      id(assist_heard).clear();
                      id(assist_response).clear();
                      id(last_activity) = millis();
                      const int link = panel_ui::link_state_for(
                          panel_ui::ha_linked(), millis() - id(link_since));
                      if (link == panel_ui::LINK_OFFLINE) {
                        id(assist_phase) = 4;
                        id(assist_response) = "Home Assistant is offline";
                      } else {
                        id(assist_phase) = 5;
                        id(assist_wait_since) = millis();
                      }
                  - script.execute: refresh_assistant_full_if_visible

  - id: start_sticky_assistant
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(draw_busy) && !id(display_dirty) &&
                     panel_ui::refresh_idle(id(epaper_display)) &&
                     id(epaper_display).get_active_page() == id(page_assistant) &&
                     id(assist_connected) && !id(sticky_voice).is_running();
          then:
            - lambda: |-
                id(assist_start_requested) = false;
                id(assist_heard).clear();
                id(assist_response).clear();
                id(assist_mic_chunks) = 0;
                id(assist_mic_activity) = 0;
                id(assist_phase) = 1;
                id(last_activity) = millis();
            - light.turn_on:
                id: buzzer
                brightness: 35%
            - delay: 80ms
            - light.turn_off: buzzer
            - output.turn_on: microphone_enable
            # Allow the PDM rail to settle before I2S starts clocking.
            - delay: 250ms
            - voice_assistant.start:
                id: sticky_voice
                silence_detection: true
          else:
            - output.turn_off: microphone_enable
            - lambda: |-
                id(assist_start_requested) = false;
                id(assist_phase) = 4;
                id(assist_response) = id(assist_connected)
                                          ? "Assistant unavailable - please try again"
                                          : "Home Assistant is offline";
                id(last_activity) = millis();
            - script.execute: refresh_assistant_full_if_visible

  # ESPHome's stop action cancels the whole Assist pipeline, so the UI labels
  # this control Cancel rather than implying it just closes the mic.
  - id: stop_sticky_assistant
    mode: restart
    then:
      - script.stop: start_sticky_assistant
      - lambda: 'id(assist_start_requested) = false;'
      - if:
          condition:
            voice_assistant.is_running:
              id: sticky_voice
          then:
            - voice_assistant.stop:
                id: sticky_voice
      - output.turn_off: microphone_enable
      - lambda: |-
          if (id(assist_phase) == 1 || id(assist_phase) == 2 || id(assist_phase) == 5) {
            id(assist_phase) = 0;
            id(assist_response) = "Request cancelled";
            id(last_activity) = millis();
          }
      - script.execute: refresh_assistant_full_if_visible

  # Fetch a fresh doorbell frame; the download-finished hook pops the page.
  # The download blocks the main loop, so draw the LOADING label first.
  - id: camera_peek
    mode: single
    then:
      - logger.log: "Action: camera peek"
      - script.execute: touch_tick
      - lambda: |-
          id(camera_title) = "${camera_title}";
          id(camera_drawn) = false;
          id(cam_image).set_url("${ha_base_url}/api/camera_proxy/${camera_entity}");
          id(camera_tile_state) = panel_ui::CAMERA_TILE_LOADING;
          id(camera_tile_changed_at) = millis();
      - script.execute: invalidate_camera_tile_if_visible
      - wait_until:
          condition:
            lambda: 'return !id(display_dirty) && !id(draw_busy);'
          timeout: 1500ms
      - component.update: cam_image

  # Final clock render, cache HA values for offline ticks, hold the power
  # latch, and sleep to the next boundary: quarter-hours 7 am - 11 pm, top
  # of the hour overnight (+3 s margin so the render lands past it).
  - id: enter_deep_sleep
    mode: single
    then:
      - logger.log: "Entering deep sleep"
      - script.execute: stop_sticky_assistant
      - script.wait: stop_sticky_assistant
      - lambda: |-
          if (id(outdoor_temp).has_state()) id(cached_out_f) = id(outdoor_temp).state;
          if (id(indoor_temp).has_state()) id(cached_in_f) = id(indoor_temp).state;
          if (id(sun_state).has_state()) id(cached_sun_up) = id(sun_state).state != "below_horizon";
          // Keep the previous snapshot if this wake never got every state.
          const uint32_t packed = panel_ui::room_model().pack_cache();
          if (packed != 0) id(light_cache) = packed;
      - display.page.show: page_sleep
      - lambda: |-
          panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 0, 0, 800, 480);
          id(display_dirty) = true;
      - wait_until:
          condition:
            lambda: 'return !id(display_dirty) && !id(draw_busy);'
          timeout: 25s
      - lambda: 'panel_ui::hold_power_rails_for_sleep();'
      - deep_sleep.enter:
          id: deep_sleep_ctl
          sleep_duration: !lambda |-
            auto now = id(rtc_time).now();
            uint32_t secs = 900;
            if (now.is_valid()) {
              const bool day = now.hour >= 7 && now.hour < 23;
              const uint32_t slot = day ? 900 : 3600;
              const uint32_t into = (now.minute * 60 + now.second) % slot;
              secs = slot - into;
              if (secs < 90) secs += slot;
            }
            return (secs + 3) * 1000;

interval:
  # Drain the refresh queue only while the driver's asynchronous state machine
  # is IDLE. Events arriving mid-refresh remain dirty and render afterward.
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool idle = panel_ui::refresh_idle(id(epaper_display));

          // Recovery piggybacks on this existing 4 Hz scheduler: no extra
          // timer, task, or polling loop. A driver that never returns to IDLE
          // gets a clean reboot, after which boot requests a full refresh.
          if (id(draw_busy) && id(draw_started_at) != 0 &&
              (now - id(draw_started_at)) > 20000UL) {
            ESP_LOGE("display", "Refresh stuck for %lu ms; rebooting for full recovery",
                     static_cast<unsigned long>(now - id(draw_started_at)));
            App.safe_reboot();
            return;
          }

          if (id(draw_busy)) {
            if (!idle) return;
            id(draw_busy) = false;
            id(draw_started_at) = 0;
            id(last_draw) = now;
            ESP_LOGD("display", "Refresh complete; queued=%d", id(display_dirty));
          }

          auto &rooms = panel_ui::room_model();
          auto *active_page = id(epaper_display).get_active_page();
          const bool api_ok = panel_ui::ha_linked();

          // Track when the link went up or down, for the footer.
          if (api_ok && id(api_connected_at) == 0) {
            id(api_connected_at) = now == 0 ? 1 : now;
          } else if (!api_ok && id(api_connected_at) != 0) {
            id(api_connected_at) = 0;
            id(link_since) = now;
          }
          const int link = panel_ui::link_state_for(api_ok, now - id(link_since));

          // Drop the saved light states 8 s after connecting, or once offline.
          if (rooms.cache_active() &&
              ((api_ok && (now - id(api_connected_at)) > 8000UL) ||
               link == panel_ui::LINK_OFFLINE)) {
            if (rooms.drop_cache() &&
                (active_page == id(page_menu) || active_page == id(page_room))) {
              id(refresh_request) = 2;
              panel_ui::include_dirty_region(id(dirty_left), id(dirty_top),
                                             id(dirty_right), id(dirty_bottom),
                                             0, 0, 800, 480);
              id(display_dirty) = true;
            }
          }

          // Expire and settle light action locks.
          if (rooms.expire_pending(now)) {
            id(action_unanswered) = true;
            id(unanswered_at) = now;
            id(touch_reject).execute();
          }
          if (id(action_unanswered) && (now - id(unanswered_at)) > 20000UL)
            id(action_unanswered) = false;
          if (!id(display_dirty) && idle && !id(draw_busy)) rooms.settle_pending(now);

          // Clear the camera tile's UNAVAILABLE label after 8 s.
          if (id(camera_tile_state) == panel_ui::CAMERA_TILE_FAILED &&
              (now - id(camera_tile_changed_at)) > 8000UL) {
            id(camera_tile_state) = panel_ui::CAMERA_TILE_IDLE;
            id(invalidate_camera_tile_if_visible).execute();
          }

          // Start a waiting Assist request once connected; give up after 10 s.
          if (id(assist_phase) == 5) {
            if (active_page != id(page_assistant)) {
              id(assist_phase) = 0;
            } else if (id(assist_connected)) {
              id(queue_sticky_assistant).execute();
            } else if ((now - id(assist_wait_since)) > 10000UL) {
              id(assist_phase) = 4;
              id(assist_response) = "Home Assistant is offline";
              id(refresh_assistant_full_if_visible).execute();
            }
          }

          // Repaint the footer when its status changes. A new link waits 1.5 s
          // so the initial burst of states shares the refresh.
          {
            const bool has_footer = active_page == id(page_menu) ||
                                    active_page == id(page_room) ||
                                    active_page == id(page_assistant);
            const int footer = panel_ui::footer_signature(link, id(action_unanswered));
            if (has_footer && id(last_draw) != 0 && footer != id(footer_drawn) &&
                (footer != panel_ui::LINK_ONLINE ||
                 (now - id(api_connected_at)) > 1500UL)) {
              panel_ui::include_dirty_region(id(dirty_left), id(dirty_top),
                                             id(dirty_right), id(dirty_bottom),
                                             0, 424, 560, 480);
              id(display_dirty) = true;
            }
          }

          // Queue voice capture behind the Assist page's physical full refresh.
          // This avoids a fixed timeout and keeps e-paper SPI work away from the
          // first spoken words.
          if (id(assist_start_requested) && !id(display_dirty) && idle &&
              !id(draw_busy) &&
              id(epaper_display).get_active_page() == id(page_assistant)) {
            id(assist_start_requested) = false;
            id(start_sticky_assistant).execute();
            return;
          }

          // State callbacks can queue header work while capture is active. Let
          // it wait rather than competing with the microphone/API stream.
          if (id(start_sticky_assistant).is_running() ||
              (id(assist_phase) == 1 && id(sticky_voice).is_running())) return;

          if (!id(display_dirty) || !idle) return;
          if (id(last_draw) != 0 && (now - id(last_draw)) < 250) return;

          // Give HA sync boots a short coalescing window so their initial
          // entity burst becomes one frame instead of several refreshes.
          if (id(last_draw) == 0 && id(boot_mode) == 2 && now < 8000) return;

          // Without saved light states (cold boot, OTA, changed layout), wait
          // for all room states rather than painting unknown tiles and then
          // inverting them with partial waveforms. Give up after 12 s so a
          // Home Assistant failure still produces an offline menu.
          if (id(last_draw) == 0 && id(boot_mode) == 0 &&
              active_page == id(page_menu) && now < 12000) {
            const bool ready = !rooms.valid() || rooms.cache_active() ||
                               (api_ok && rooms.all_known());
            if (!ready) return;
          }

          const bool full = id(refresh_request) >= 2 || id(partial_refreshes) >= 12;
          panel_ui::DirtyRegion region;
          region.left = id(dirty_left);
          region.top = id(dirty_top);
          region.right = id(dirty_right);
          region.bottom = id(dirty_bottom);
          id(dirty_left) = 800;
          id(dirty_top) = 480;
          id(dirty_right) = 0;
          id(dirty_bottom) = 0;
          if (full || region.empty()) region.include(0, 0, 800, 480);
          id(footer_in_frame) = region.left <= 20 && region.top <= 430 &&
                                region.right >= 540 && region.bottom >= 470;

          if (full) {
            panel_ui::force_full_refresh(id(epaper_display));
            id(partial_refreshes) = 0;
          } else {
            panel_ui::mark_partial_refresh(id(epaper_display));
            id(partial_refreshes) += 1;
          }

          // Consume only the requests included in this frame. A callback that
          // fires after update() starts will set dirty/request for the next.
          id(refresh_request) = 0;
          id(display_dirty) = false;
          id(draw_busy) = true;
          id(draw_started_at) = now;
          // EPaperBase::update() defers Display::do_update_ to its loop. That
          // method renders the page lambda, then clears the clipping stack;
          // the physical e-paper transfer continues asynchronously. Leaving
          // this clip set here applies it to that next render only.
          const bool regional = !full &&
              (region.left != 0 || region.top != 0 ||
               region.right != 800 || region.bottom != 480);
          if (regional) {
            id(epaper_display).start_clipping(region.left, region.top,
                                               region.right, region.bottom);
          }
          ESP_LOGI("display", "Starting %s refresh region=(%d,%d)-(%d,%d) partial streak=%d",
                   full ? "FULL" : "PARTIAL", region.left, region.top,
                   region.right, region.bottom, id(partial_refreshes));
          id(epaper_display).update();

  # Refresh the compact sensor header every 5 minutes.
  - interval: 300s
    then:
      - script.execute: invalidate_header_if_visible
  # Clock page after idle_clock_seconds idle, regardless of power state.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(epaper_display).get_active_page() != id(page_sleep) &&
                     id(epaper_display).get_active_page() != id(page_camera) &&
                     !(id(epaper_display).get_active_page() == id(page_assistant) &&
                       (id(assist_start_requested) || id(sticky_voice).is_running())) &&
                     (millis() - id(last_activity)) > ${idle_clock_seconds} * 1000UL;
          then:
            - display.page.show: page_sleep

  # Deep sleep entry - battery only, dwell per wake mode:
  #   mode 1: as soon as the partial clock render lands (~10 s awake)
  #   mode 2: once the API synced and any recap ran (25 s / 60 s / 120 s caps)
  #   mode 0: after idle_sleep_seconds without touches or buttons
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              if (id(enter_deep_sleep).is_running()) return false;
              // GPIO9 is the board's dedicated USB/external-power detect.
              // Unlike the averaged fuel-gauge current, it remains exact at
              // boot and when a full battery is drawing nearly zero current.
              const bool powered = gpio_get_level(GPIO_NUM_9) != 0;
              if (powered) return false;
              const uint32_t up = millis();
              if (id(boot_mode) == 1)
                return up > 8000 && !id(display_dirty) && !id(draw_busy);
              if (id(boot_mode) == 2) {
                if (id(epaper_display).get_active_page() == id(page_camera))
                  return up > 120000;
                const bool api_ok = api::global_api_server != nullptr &&
                                    api::global_api_server->is_connected();
                return (api_ok && up > 25000) || up > 60000;
              }
              return (up - id(last_activity)) > ${idle_sleep_seconds} * 1000UL;
          then:
            - script.execute: enter_deep_sleep

  # Camera popup auto-dismisses after 60 s.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(epaper_display).get_active_page() == id(page_camera) &&
                     (millis() - id(camera_shown_at)) > 60000UL;
          then:
            - lambda: |-
                auto *target = (id(boot_mode) != 0 ||
                                (millis() - id(last_activity)) > ${idle_clock_seconds} * 1000UL)
                                   ? id(page_sleep)
                                   : id(page_menu);
                id(epaper_display).show_page(target);

  # Missed-ring recap: when the doorbell automation's last_triggered moves,
  # remember it; show the saved snapshot unless the camera page already
  # showed this ring live within the last 5 minutes.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(last_ring).has_state() && !id(last_ring).state.empty() &&
                     esphome::fnv1_hash(id(last_ring).state) != id(last_ring_hash);
          then:
            - lambda: 'id(last_ring_hash) = esphome::fnv1_hash(id(last_ring).state);'
            - if:
                condition:
                  lambda: |-
                    return id(camera_shown_at) == 0 ||
                           (millis() - id(camera_shown_at)) > 300000UL;
                then:
                  - logger.log: "Missed ring detected; fetching snapshot"
                  - lambda: |-
                      id(camera_title) = "${missed_ring_title}";
                      id(camera_drawn) = false;
                      id(cam_image).set_url("${ha_base_url}${missed_ring_snapshot_path}");
                  - component.update: cam_image
