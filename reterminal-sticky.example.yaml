# SPI: shared by ePaper display and SD card
spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

# I2C sensor bus: SHT4x, PCF8563, BQ27220, LSM6DS3
# GPIO0 is an ESP32-S3 strapping pin; keep this bus passive during boot.
# I2C touch bus: GT911 touch controller
i2c:
  - id: i2c_sensor
    scl: GPIO0
    sda: GPIO1
    frequency: 400kHz

  - id: i2c_touch
    scl: GPIO2
    sda: GPIO3
    frequency: 100kHz

# Onboard PDM microphone. The 3.97-inch Sticky routes PDM clock/data to
# GPIO19/GPIO20; GPIO38 gates its power rail. No speaker, by design.
i2s_audio:
  - id: i2s_microphone_bus
    i2s_lrclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: onboard_microphone
    i2s_audio_id: i2s_microphone_bus
    i2s_din_pin: GPIO20
    adc_type: external
    pdm: true
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit
    correct_dc_offset: true
    on_data:
      then:
        - lambda: |-
            if (!id(sticky_voice).is_running()) return;
            id(assist_mic_chunks) += 1;
            // Bounded diagnostics only; no audio is retained or logged.
            for (const uint8_t byte : x) {
              if (byte != 0x00 && byte != 0xFF) id(assist_mic_activity) += 1;
            }

output:
  # Power latch hold: must be HIGH or the device powers off
  - platform: gpio
    pin: GPIO45
    id: pwr_hold

  # Power lock: must be HIGH after boot
  - platform: gpio
    pin: GPIO46
    id: pwr_lock

  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 1000Hz

  # BQ25616 charger enable (GPIO39, active LOW: LOW = charging enabled)
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: charge_enable

  # Active-high microphone rail, enabled only for one manually initiated
  # Assist capture and held low through deep sleep.
  - platform: gpio
    pin: GPIO38
    id: microphone_enable

switch:
  - platform: gpio
    pin: GPIO42
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100

sensor:
  # SHT40 temperature & humidity (I2C @0x44). Convert the local temperature
  # once so the header, sleep face, restored cache, and HA entity all use °F.
  - platform: sht4x
    i2c_id: i2c_sensor
    address: 0x44
    temperature:
      name: "Temperature"
      id: indoor_temp
      unit_of_measurement: "°F"
      accuracy_decimals: 1
      filters:
        - lambda: 'return x * 9.0f / 5.0f + 32.0f;'
      on_value:
        then:
          - script.execute: invalidate_temperature_if_visible
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
    update_interval: 60s
  # Outdoor temperature imported from the Home Assistant weather station.
  - platform: homeassistant
    id: outdoor_temp
    entity_id: ${outdoor_temp_entity}
    internal: true
    on_value:
      then:
        - script.execute: invalidate_temperature_if_visible

  # BQ27220 state-of-charge (I2C @0x55, register 0x2C)
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      const uint16_t soc = static_cast<uint16_t>(raw[0]) |
                           (static_cast<uint16_t>(raw[1]) << 8);
      if (soc > 100) {
        ESP_LOGW("battery", "Rejecting invalid state of charge: %u%%", soc);
        return NAN;
      }
      return static_cast<float>(soc);

  # BQ27220 battery voltage in millivolts (register 0x08)
  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x08;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      const uint16_t millivolts = static_cast<uint16_t>(raw[0]) |
                                  (static_cast<uint16_t>(raw[1]) << 8);
      if (millivolts < 2500 || millivolts > 4500) {
        ESP_LOGW("battery", "Rejecting invalid battery voltage: %u mV", millivolts);
        return NAN;
      }
      return static_cast<float>(millivolts);

  # BQ27220 signed charge/discharge current in milliamps (register 0x0C)
  - platform: template
    id: battery_current
    name: "Battery Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x0C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      uint16_t raw_value = static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8);
      const int16_t milliamps = static_cast<int16_t>(raw_value);
      // The Sticky has a 750 mAh single-cell pack. Readings beyond 1.5 A are
      // treated as transient/uninitialised gauge data rather than published.
      if (milliamps < -1500 || milliamps > 1500) {
        ESP_LOGW("battery", "Rejecting implausible battery current: %d mA", milliamps);
        return NAN;
      }
      return static_cast<float>(milliamps);

binary_sensor:
  # Dedicated USB/external-power detect on the stock Sticky board.
  # This is distinct from charge current: it remains ON when the battery is
  # full and the charger has tapered to zero.
  - platform: gpio
    pin:
      number: GPIO9
      allow_other_uses: true
      mode: INPUT
    id: external_power
    name: "External Power"
    device_class: power

  # UP button (GPIO5): short beep
  - platform: gpio
    pin:
      number: GPIO5
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    id: button_up
    name: "Button UP"
    on_press:
      then:
        - logger.log: "Button UP pressed"
        - lambda: |-
            id(last_activity) = millis();
            // Wi-Fi starts now after a timer wake; restart the footer's wait.
            if (id(boot_mode) != 0) id(link_since) = millis();
            id(boot_mode) = 0;
        - wifi.enable:
        - script.execute: button_beep
        - if:
            condition:
              lambda: |-
                return id(epaper_display).get_active_page() == id(page_sleep) ||
                       millis() < 4000;
            then:
              - display.page.show: page_menu

  # DOWN button (GPIO6): short beep
  - platform: gpio
    pin:
      number: GPIO6
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    id: button_down
    name: "Button DOWN"
    on_press:
      then:
        - logger.log: "Button DOWN pressed"
        - lambda: |-
            id(last_activity) = millis();
            // Wi-Fi starts now after a timer wake; restart the footer's wait.
            if (id(boot_mode) != 0) id(link_since) = millis();
            id(boot_mode) = 0;
        - wifi.enable:
        - script.execute: button_beep
        - if:
            condition:
              lambda: |-
                return id(epaper_display).get_active_page() == id(page_sleep) ||
                       millis() < 4000;
            then:
              - display.page.show: page_menu

  # OK / Power button (GPIO4): also deep-sleep wake source
  - platform: gpio
    pin:
      number: GPIO4
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    id: button_ok
    name: "Button OK"
    on_press:
      then:
        - logger.log: "Button OK pressed"
        - lambda: |-
            id(last_activity) = millis();
            // Wi-Fi starts now after a timer wake; restart the footer's wait.
            if (id(boot_mode) != 0) id(link_since) = millis();
            id(boot_mode) = 0;
        - wifi.enable:
        - script.execute: button_beep
        # Asleep or the ext1 press that woke us: navigate only, never toggle.
        - if:
            condition:
              lambda: |-
                return id(epaper_display).get_active_page() == id(page_sleep) ||
                       millis() < 4000;
            then:
              - display.page.show: page_menu
            else:
              - if:
                  condition:
                    lambda: 'return id(epaper_display).get_active_page() == id(page_room);'
                  then:
                    - script.execute:
                        id: toggle_room_card
                        room_index: !lambda 'return panel_ui::room_model().active_room();'
                        card_index: 0
                  else:
                    - if:
                        condition:
                          lambda: 'return id(epaper_display).get_active_page() == id(page_assistant);'
                        then:
                          - if:
                              condition:
                                voice_assistant.is_running:
                                  id: sticky_voice
                              then:
                                - script.execute: stop_sticky_assistant
                              else:
                                - script.execute: queue_sticky_assistant

  # Active charging requires both physical USB presence and positive gauge
  # current. External Power above remains ON after a full battery tapers to 0.
  - platform: template
    id: charging
    name: "Battery Charging"
    lambda: |-
      if (!id(external_power).state || isnan(id(battery_current).state)) {
        return false;
      }
      return id(battery_current).state > 20.0f;

light:
  # Buzzer wrapped as a "light": brightness = volume
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s

# Sun elevation drives the sleep face day/night icon.
text_sensor:
  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun
    internal: true
    on_value:
      then:
        - script.execute: invalidate_sleep_if_visible

  # The doorbell automation's own last_triggered doubles as the missed-ring
  # signal; no extra HA helper entity needed.
  - platform: homeassistant
    id: last_ring
    entity_id: ${doorbell_automation_entity}
    attribute: last_triggered
    internal: true

time:
  # PCF8563 at I2C address 0x51. Read on boot; HA sync writes back.
  - platform: pcf8563
    i2c_id: i2c_sensor
    id: rtc_time
    address: 0x51
    update_interval: never

  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf8563.write_time:
    # Tick the sleep clock once a minute (partial refresh, no flash).
    on_time:
      - seconds: 0
        then:
          - if:
              condition:
                lambda: 'return id(epaper_display).get_active_page() == id(page_sleep);'
              then:
                - lambda: |-
                    panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 360, 80, 800, 390);
                    id(display_dirty) = true;

api:
  encryption:
    key: !secret api_encryption_key
  # Allow device->HA action calls (light.toggle) and HA state subscriptions
  homeassistant_services: true
  homeassistant_states: true
  # HA automations call this to push a snapshot onto the panel. Empty and
  # relative URLs resolve against Home Assistant. Absolute URLs are accepted
  # only when their origin exactly matches ha_base_url, because online_image
  # sends the configured Authorization header with every request.
  actions:
    - action: show_camera
      variables:
        snapshot_url: string
      then:
        - lambda: |-
            id(camera_title) = "${camera_title}";
            id(camera_drawn) = false;
            const auto snapshot = panel_ui::resolve_camera_snapshot_url(
                "${ha_base_url}", snapshot_url,
                "/api/camera_proxy/${camera_entity}");
            if (snapshot.rejected) {
              ESP_LOGW("camera", "Rejected snapshot URL outside the configured Home Assistant origin");
            }
            id(cam_image).set_url(snapshot.url);
        - component.update: cam_image

# One-shot, text-only Home Assistant Assist client. Home Assistant performs STT
# and intent handling; the Sticky powers its mic only after a tap and renders
# the returned text. No speaker/media_player is configured, so TTS never plays.
voice_assistant:
  id: sticky_voice
  microphone:
    microphone: onboard_microphone
    gain_factor: 4
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 20dBFS
  conversation_timeout: 60s
  on_client_connected:
    then:
      - lambda: 'id(assist_connected) = true;'
  on_client_disconnected:
    then:
      - output.turn_off: microphone_enable
      - lambda: |-
          id(assist_connected) = false;
          if (id(assist_phase) == 1 || id(assist_phase) == 2) {
            id(assist_phase) = 4;
            id(assist_response) = "Home Assistant disconnected";
          }
      - script.execute: refresh_assistant_full_if_visible
  on_listening:
    then:
      - lambda: |-
          id(assist_phase) = 1;
          id(last_activity) = millis();
  on_stt_vad_end:
    then:
      # Home Assistant has received the utterance; stop powering the mic while
      # the remote pipeline transcribes and handles it.
      - output.turn_off: microphone_enable
      - lambda: |-
          id(assist_phase) = 2;
          id(last_activity) = millis();
      # Don't spend a display cycle on this brief intermediate state. The
      # settled transcript + response frame below gets one clean full refresh.
  on_stt_end:
    then:
      - lambda: |-
          id(assist_heard) = panel_ui::clean_assistant_text(x, 240);
          id(assist_phase) = 2;
          id(last_activity) = millis();
  on_tts_start:
    then:
      - lambda: |-
          id(assist_response) = panel_ui::clean_assistant_text(x, 320);
          if (id(assist_response).empty()) id(assist_response) = "Done";
          id(assist_phase) = 3;
          id(last_activity) = millis();
      - script.execute: refresh_assistant_full_if_visible
  on_error:
    then:
      - output.turn_off: microphone_enable
      - lambda: |-
          (void) message;
          id(assist_phase) = 4;
          id(assist_response) = code == "stt-stream-failed"
                                    ? "Speech service unavailable - check Home Assistant"
                                    : "Assistant request failed - please try again";
          id(last_activity) = millis();
      - script.execute: refresh_assistant_full_if_visible
  on_end:
    then:
      - output.turn_off: microphone_enable
      - lambda: |-
          if (id(assist_phase) == 1 || id(assist_phase) == 2) {
            id(assist_phase) = 4;
            if (id(assist_mic_chunks) == 0) {
              id(assist_response) = "Microphone produced no samples";
            } else if (id(assist_mic_activity) == 0) {
              id(assist_response) = "Microphone signal was silent";
            } else {
              id(assist_response) = "I didn't get an answer - please try again";
            }
          }
          id(last_activity) = millis();
      - script.execute: refresh_assistant_full_if_visible
  on_idle:
    then:
      - output.turn_off: microphone_enable


# Only ever entered from enter_deep_sleep (battery + idle). Any of the three
# buttons or USB insertion wakes the panel; the timer wake redraws the clock.
deep_sleep:
  id: deep_sleep_ctl
  # GPIO9 rises when USB power is connected. It is an ESP32-S3 RTC GPIO, so
  # EXT0 can wake on HIGH while the three active-low buttons remain grouped in
  # EXT1. KEEP_AWAKE also closes the race if USB arrives during sleep entry.
  wakeup_pin:
    number: GPIO9
    allow_other_uses: true
    mode: INPUT
  wakeup_pin_mode: KEEP_AWAKE
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO4
        allow_other_uses: true
      - number: GPIO5
        allow_other_uses: true
      - number: GPIO6
        allow_other_uses: true
ota:
  - platform: esphome
    password: !secret ota_password

# Runtime camera snapshot: fetched over HTTP from Home Assistant, decoded to
# grayscale, and drawn 1-bit dithered by panel_ui. The Bearer header only
# matters for the camera_proxy endpoint; /local snapshot files are unauth.
http_request:
  timeout: 15s
  buffer_size_rx: 8192
  # Never forward the Home Assistant bearer header across an HTTP redirect.
  follow_redirects: false

image:
  - platform: online_image
    id: cam_image
    url: ${ha_base_url}/api/camera_proxy/${camera_entity}
    format: JPEG
    type: GRAYSCALE
    update_interval: never
    request_headers:
      Authorization: !secret ha_bearer
    on_download_finished:
      then:
        - lambda: |-
            id(camera_tile_state) = panel_ui::CAMERA_TILE_IDLE;
            id(camera_shown_at) = millis();
            id(refresh_request) = 2;
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 0, 0, 800, 480);
            id(display_dirty) = true;
        - display.page.show: page_camera
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Camera snapshot download failed"
        # Only a request made from the tile reports its failure there.
        - if:
            condition:
              lambda: 'return id(camera_tile_state) == panel_ui::CAMERA_TILE_LOADING;'
            then:
              - lambda: |-
                  id(camera_tile_state) = panel_ui::CAMERA_TILE_FAILED;
                  id(camera_tile_changed_at) = millis();
              - script.execute: invalidate_camera_tile_if_visible
              - script.execute: touch_reject

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: ${wifi_fast_connect}
  ap:
    ssid: "reTerminal-Sticky"
    password: !secret fallback_ap_password

captive_portal:

# GT911 capacitive touch (I2C @0x5D on i2c_touch, 800x480).
touchscreen:
  - platform: gt911
    i2c_id: i2c_touch
    id: sticky_touch
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    # GT911 reports portrait-oriented axes; swap them for the 800x480 display.
    # Hardware corner tests showed that the raw axes match the display after
    # the swap; the stock panel needs no mirroring or numerical calibration.
    transform:
      swap_xy: true
    on_touch:
      - lambda: |-
          id(last_activity) = millis();
          if (id(boot_mode) != 0) id(link_since) = millis();
          id(boot_mode) = 0;
          auto *page = id(epaper_display).get_active_page();
          const int page_kind = page == id(page_sleep)  ? 0
                              : page == id(page_menu)   ? 1
                              : page == id(page_room)   ? 2
                              : page == id(page_camera) ? 3
                              : page == id(page_assistant) ? 4
                                                        : -1;
          panel_ui::room_model().begin_touch(touch.x, touch.y, page_kind);
      - wifi.enable:
      - logger.log:
          format: "Touch x=%d y=%d"
          args: [touch.x, touch.y]
    # Route exactly once on release. The saved page-at-press prevents a page
    # change (especially the camera popup) from turning the same touch into a
    # second action on the destination page.
    on_release:
      - lambda: |-
          auto &rooms = panel_ui::room_model();
          const auto press = rooms.take_touch();
          if (!press.valid) return;
          ESP_LOGD("touch", "Release x=%d y=%d page=%d", press.x, press.y, press.page);

          // Navigation ticks here; light actions tick only when accepted.
          if (press.page == 0) {
            id(touch_tick).execute();
            id(epaper_display).show_page(id(page_menu));
            return;
          }

          if (press.page == 1) {
            if (press.x >= 360 && press.x <= 452 && press.y >= 0 && press.y <= 64) {
              id(touch_tick).execute();
              id(epaper_display).show_page(id(page_sleep));
              return;
            }
            const int slot = rooms.menu_slot_at(press.x, press.y);
            if (slot >= 0 && slot < rooms.room_count()) {
              // The tile's lower strip switches the whole room.
              if (${menu_quick_toggle} && panel_ui::menu_press_in_quick_strip(press.y)) {
                id(toggle_room).execute(slot);
              } else if (rooms.set_active_room(slot)) {
                id(touch_tick).execute();
                id(epaper_display).show_page(id(page_room));
              }
            } else if (slot == rooms.camera_slot()) {
              id(camera_peek).execute();
            } else if (slot == rooms.assistant_slot()) {
              id(touch_tick).execute();
              id(queue_sticky_assistant).execute();
              id(epaper_display).show_page(id(page_assistant));
            }
            return;
          }

          if (press.page == 2) {
            if (press.x >= 0 && press.x <= 300 && press.y >= 0 && press.y <= 64) {
              id(touch_tick).execute();
              id(epaper_display).show_page(id(page_menu));
              return;
            }
            if (press.x >= 360 && press.x <= 452 && press.y >= 0 && press.y <= 64) {
              id(touch_tick).execute();
              id(epaper_display).show_page(id(page_sleep));
              return;
            }
            const int room_index = rooms.active_room();
            const int card_index = rooms.card_at_x(room_index, press.x);
            if (card_index < 0) return;
            if (press.y >= 70 && press.y <= 300) {
              id(toggle_room_card).execute(room_index, card_index);
            } else if (press.y >= 306 && press.y <= 430) {
              const int level = panel_ui::brightness_level_at(
                  press.x - rooms.card_x(room_index, card_index));
              id(set_room_card_brightness).execute(room_index, card_index, level);
            }
            return;
          }

          if (press.page == 3 && id(camera_drawn)) {
            id(touch_tick).execute();
            id(epaper_display).show_page(id(page_menu));
          }

          if (press.page == 4) {
            if (press.x >= 0 && press.x <= 300 && press.y >= 0 && press.y <= 64) {
              id(stop_sticky_assistant).execute();
              id(touch_tick).execute();
              id(epaper_display).show_page(id(page_menu));
            } else if (press.x >= 360 && press.x <= 452 && press.y >= 0 && press.y <= 64) {
              id(stop_sticky_assistant).execute();
              id(touch_tick).execute();
              id(epaper_display).show_page(id(page_sleep));
            } else if (press.y >= 350 && press.y <= 425 &&
                       press.x >= 20 && press.x <= 780) {
              if (id(assist_phase) == 1 || id(assist_phase) == 2 || id(assist_phase) == 5 ||
                  id(assist_start_requested) || id(sticky_voice).is_running()) {
                id(stop_sticky_assistant).execute();
              } else {
                id(queue_sticky_assistant).execute();
              }
            }
          }

# e-paper display (3.97-inch B/W, 800x480, SSD1677, SPI).
# The "seeed-reterminal-sticky" model preset (ESPHome PR #16950) auto-fills
# cs_pin=GPIO15, dc_pin=GPIO16, reset_pin=GPIO17, busy_pin=GPIO18,
# enable_pin=GPIO47, mirror_x, and 10 MHz data rate. Tested with 2026.7.4.

# Page architecture: page_menu is home; page_room renders whichever room is
# active in room_model.h; sleep, camera, and Assist remain dedicated pages.
display:
  - platform: epaper_spi
    id: epaper_display
    model: seeed-reterminal-sticky
    update_interval: never
    # Keep the controller in partial-capable sleep. The queue above owns the
    # actual FULL/PARTIAL policy instead of relying on this volatile counter.
    full_update_every: 255
    # Page changes request a full flash-clean. Don't mutate the driver's
    # counter here: the current refresh may still be in flight.
    on_page_change:
      then:
        - lambda: |-
            id(refresh_request) = 2;
            panel_ui::include_dirty_region(id(dirty_left), id(dirty_top), id(dirty_right), id(dirty_bottom), 0, 0, 800, 480);
            id(display_dirty) = true;
    pages:
      - id: page_sleep
        lambda: |-
          ESP_LOGD("display", "=== ePaper refresh: sleep ===");
          auto c = panel_ui::Ctx{it, id(font_small), id(font_value), id(font_medium),
                                 id(icons_sm), id(icons_lg), COLOR_OFF, COLOR_ON};
          const float out_f = id(outdoor_temp).has_state() ? id(outdoor_temp).state : id(cached_out_f);
          const float in_f = id(indoor_temp).has_state() ? id(indoor_temp).state : id(cached_in_f);
          auto now = id(rtc_time).now();
          const bool sun_up = id(sun_state).has_state()
                                  ? id(sun_state).state != "below_horizon"
                                  : id(cached_sun_up);
          panel_ui::draw_sleep_face(c, id(font_clock), id(font_temp), now.is_valid(), now.hour, now.minute,
                                    now.day_of_week, now.month, now.day_of_month,
                                    out_f, in_f, sun_up,
                                    id(battery_level).state, id(charging).state);

      - id: page_menu
        lambda: |-
          ESP_LOGD("display", "=== ePaper refresh: menu ===");
          auto c = panel_ui::Ctx{it, id(font_small), id(font_value), id(font_medium),
                                 id(icons_sm), id(icons_lg), COLOR_OFF, COLOR_ON};
          // Fall back to the readings saved at sleep entry.
          const float out_f = id(outdoor_temp).has_state() ? id(outdoor_temp).state : id(cached_out_f);
          const float in_f = id(indoor_temp).has_state() ? id(indoor_temp).state : id(cached_in_f);
          id(shown_out_f) = out_f;
          id(shown_in_f) = in_f;
          panel_ui::draw_header(c, "${home_label}", false, out_f, in_f,
                                id(battery_level).state, id(charging).state);

          auto &rooms = panel_ui::room_model();
          const bool quick_toggle = ${menu_quick_toggle};
          if (!rooms.valid()) panel_ui::draw_setup_error(c, rooms.error());

          for (int room_index = 0; rooms.valid() && room_index < rooms.room_count(); room_index++) {
            const auto *room = rooms.room(room_index);
            if (room == nullptr) continue;
            const bool known = rooms.room_known(room_index);
            const int on_count = rooms.room_on_count(room_index);
            panel_ui::draw_menu_tile(c,
                                     panel_ui::RoomModel::menu_x(room_index),
                                     panel_ui::RoomModel::menu_y(room_index),
                                     room->name, room->icon.c_str(), known,
                                     known ? on_count : 0, room->card_count,
                                     quick_toggle);
            rooms.mark_menu_rendered(room_index);
          }

          if (rooms.valid() && rooms.camera_enabled()) {
            const int slot = rooms.camera_slot();
            panel_ui::draw_camera_tile(c,
                                       panel_ui::RoomModel::menu_x(slot),
                                       panel_ui::RoomModel::menu_y(slot),
                                       "${camera_label}", "\U000F0869",
                                       id(camera_tile_state), quick_toggle);
          }

          if (rooms.valid() && rooms.assistant_enabled()) {
            const int slot = rooms.assistant_slot();
            panel_ui::draw_assistant_tile(c,
                                          panel_ui::RoomModel::menu_x(slot),
                                          panel_ui::RoomModel::menu_y(slot),
                                          "${assistant_label}", quick_toggle);
          }

          auto now = id(rtc_time).now();
          const int link = panel_ui::link_state_for(panel_ui::ha_linked(),
                                                    millis() - id(link_since));
          panel_ui::draw_footer(c, now.is_valid() ? now.hour : -1,
                                now.is_valid() ? now.minute : 0, link,
                                id(action_unanswered));
          if (id(footer_in_frame))
            id(footer_drawn) = panel_ui::footer_signature(link, id(action_unanswered));

